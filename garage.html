<style>
/* Layout: one full-bleed 3D frame under 2.39:1 letterbox bars; a film slate top-left, three controls bottom. Single dark look by design. */
:root {
  color-scheme: dark;
  --ink: #05070a;            /* letterbox + page ground */
  --paper: #dfe6ea;          /* slate text */
  --dim: #8b98a3;            /* secondary text */
  --sodium: #ff9a3c;         /* streetlight orange, the accent */
  --panel: rgba(10, 14, 18, .62);
  --line: rgba(223, 230, 234, .22);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar: 9vh;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--mono); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
.bar { position: fixed; left: 0; right: 0; height: var(--bar); background: var(--ink); pointer-events: none; z-index: 2; }
.bar.top { top: 0; height: calc(var(--bar) + env(safe-area-inset-top, 0px)); }
.bar.bot { bottom: 0; height: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); }
#fade { position: fixed; inset: 0; background: var(--ink); opacity: 1; pointer-events: none; z-index: 1; }
.hud {
  position: fixed; z-index: 3; left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.hud.top { top: env(safe-area-inset-top, 0px); height: var(--bar); }
.hud.bot { bottom: env(safe-area-inset-bottom, 0px); min-height: var(--bar); justify-content: center; }
h1 { margin: 0; font: 700 clamp(11px, 1.5vw, 15px)/1 var(--display); letter-spacing: .28em; text-transform: uppercase; }
h1 span { color: var(--sodium); }
#slate { font-size: clamp(10px, 1.2vw, 12px); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap; }
#slate b { color: var(--paper); font-weight: 600; }
.rec { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; margin-right: 8px; animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
button {
  font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper); background: var(--panel); border: 1px solid var(--line);
  padding: 10px 14px; border-radius: 2px; cursor: pointer; backdrop-filter: blur(6px);
}
button:hover { border-color: var(--sodium); color: var(--sodium); }
button:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--sodium); color: var(--sodium); }
[hidden] { display: none !important; }
#err { position: fixed; inset: 0; z-index: 4; background: rgba(5,7,10,.8); display: grid; place-items: center; padding: 24px; text-align: center; color: var(--dim); }
@media (max-width: 560px) { :root { --bar: 64px; } }
@media (prefers-reduced-motion: reduce) { .rec { animation: none; } }
</style>

<script type="module">

const stage = document.getElementById('stage');

/* ---------- procedural textures ---------- */
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function canvasTex(w, h, draw, srgb) {

let floorCanvas;
const floorRough = canvasTex(1024, 1024, (g, w, h) => {

  const r = rng(7);

});
const wallTex = canvasTex(1024, 512, (g, w, h) => {
  const r = rng(21);
  g.fillStyle = '#5b6064'; g.fillRect(0, 0, w, h);
  const bw = 64, bh = 32;

/* ---------- room ---------- */
const RX = 9, RZ = 7, RH = 4.5;

  m.position.set(x, RH / 2, z); m.rotation.y = ry; m.receiveShadow = true; room.add(m);
}

wallPlane(RX * 2, 0, RZ, Math.PI);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(RX * 2, RZ * 2), mDark);
ceil.rotation.x = Math.PI / 2; ceil.position.y = RH; room.add(ceil);
for (let i = 0; i < 5; i++) box(.25, .35, RZ * 2, mSteel, -7.2 + i * 3.6, RH - .18, 0, room, false);

// wet floor: a dim mirror under a translucent concrete slab, puddles let more mirror through
const mirror = new Reflector(new THREE.PlaneGeometry(RX * 2, RZ * 2), { textureWidth: 1024, textureHeight: 1024, color: 0x8a9096 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(RX * 2, RZ * 2), new THREE.MeshStandardMaterial({
  color: 0x30343a, map: twin(floorRough, true), roughnessMap: floorRough, roughness: 1, metalness: 0,

});

// door wall (+X) with a row of four windows; the streetlight outside shines through them
const mDoor = new THREE.MeshStandardMaterial({ color: 0x2b3136, roughness: .55, metalness: 0, envMapIntensity: .4 });

box(.12, RH, .25, mSteel, RX - .05, RH / 2, -3.15, room, false); box(.12, RH, .25, mSteel, RX - .05, RH / 2, 3.15, room, false);
const SODIUM = new THREE.Color(1.0, .52, .16);
const winZ = [0, 1, 2, 3].map(i => -3 + .24 + .6 + i * 1.44);
const mPane = new THREE.MeshBasicMaterial({ color: SODIUM.clone().multiplyScalar(1.5), transparent: true, opacity: .55, fog: false });
winZ.forEach(z => { const p = new THREE.Mesh(new THREE.PlaneGeometry(1.2, .6), mPane); p.rotation.y = -Math.PI / 2; p.position.set(RX + .02, 2.6, z); room.add(p); });

const LPOS = new THREE.Vector3(15, 4.4, 0);
const street = new THREE.SpotLight(SODIUM, 520, 26, .62, .5, 1.6);
street.position.copy(LPOS); street.target.position.set(0, 0, 0);

// light shafts: stacked additive sheets along each window beam
const shaftMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
  uniforms: { uCol: { value: SODIUM.clone() }, uTime: { value: 0 }, uAmp: { value: .008 } },
  vertexShader: `varying vec2 vUv; varying vec3 vW, vAx, vN; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vAx=normalize(mat3(modelMatrix)*vec3(1.,0.,0.)); vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`,

// overhead fluorescent tubes
const TUBE = new THREE.Color(.62, .86, 1);

const mRed = new THREE.MeshPhysicalMaterial({ color: 0x7a1512, roughness: .45, metalness: 0, clearcoat: .8, clearcoatRoughness: .12, envMapIntensity: .7 });

box(3.2, 1.3, .03, mDark, -5, 1.9, -RZ + .03, room, false);                              // pegboard

for (let i = 0; i < 6; i++) box(.9, .025, .02, mSteel, 0, .25 + i * .15 + (i > 4 ? .3 : 0), .29, chest, false);
const drumG = new THREE.CylinderGeometry(.3, .3, .9, 24);
[[-7.9, 5.9, 0x1d3b4a], [-7.2, 6.2, 0x4a3a12], [-7.7, 5.2, 0x1d3b4a]].forEach(([x, z, c]) => {
  const d = new THREE.Mesh(drumG, new THREE.MeshStandardMaterial({ color: c, roughness: .5, metalness: 0, envMapIntensity: .5 }));
  d.position.set(x, .45, z); d.castShadow = d.receiveShadow = true; room.add(d);
});

}

        const pw = world.get(r.b.parent) || r.b.parent.getWorldQuaternion(Q());

  const SPOT = { fire: new THREE.Vector3(-12.9, 0, -1.7), bar: new THREE.Vector3(-15.4, 0, 3.7) };
  const plan = [['dance', 15, 1.1], ['walk', 'bar'], ['idle', 7, 0], ['walk', 'fire']]; let step = 0, tLeft = plan[0][1], face = plan[0][2];

house.traverse(m => { if (m.isMesh) { m.receiveShadow = true; const t = m.geometry.type; m.castShadow = !!m.userData.cast || (!m.material.isMeshBasicMaterial && t !== 'PlaneGeometry' && t !== 'CircleGeometry'); } });

const ROOMS = {
  garage: { label: 'Garage', target: [0, .6, 0], cam: [5, 1.1, 4.4], min: 3, max: 6.6 },
  lounge: { label: 'Lounge', key: [-12.2, 2.92, -1.0, LX, .3, LZ, 66], target: [LX, .7, LZ], cam: [-10.6, 1.6, .2], min: 2.2, max: 5.2,
    lights: [[LX, .9, LZ, 1, .42, .1, 26], [globePos.x, globePos.y - .3, globePos.z, 1, .7, .4, 16], [-17.5, 2.4, -6, 1, .1, .6, 16], [-11, 2.5, -5.5, .1, .7, .8, 9]] },

};

/* ---------- reflections for the paint: bake the room itself ---------- */
function setNeon(t) {
  const h = .86 + .18 * Math.sin(t * .11);                // magenta ↔ violet ↔ cyan-ish
  neonMat.color.setHSL(h % 1, 1, .5).multiplyScalar(3.2);
  neonMat2.color.setHSL((h + .42) % 1, 1, .5).multiplyScalar(2.6);
  neonLight.color.setHSL(h % 1, 1, .5);
}
setNeon(0);
car.visible = false; mirror.visible = false; dust.visible = false;
const pmrem = new THREE.PMREMGenerator(renderer);
const envs = {}; envs.garage = pmrem.fromScene(scene, .03, .1, 40).texture; scene.environment = envs.garage;
scene.environmentIntensity = .9;
car.visible = true; mirror.visible = true; dust.visible = true;

/* ---------- post ---------- */
const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
// one invalid pixel would otherwise be smeared across the whole frame by the bloom blur
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb;
      if(!(c.r==c.r)||!(c.g==c.g)||!(c.b==c.b)||c.r<0.||c.g<0.||c.b<0.) c=vec3(0.);
      gl_FragColor=vec4(min(c,vec3(40.)),1.); }`
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(4, 4), .3, .55, 1.2); composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){ vec2 c=vUv-.5; float d=dot(c,c); vec2 o=c*d*.005;

function resize() {

  renderer.setSize(w, h, false); composer.setPixelRatio(DPR); composer.setSize(w, h);
  camera.aspect = w / h; if (typeof setFov === 'function' && fovReady) setFov(baseFov); else camera.updateProjectionMatrix();
}
let fovReady = false;
addEventListener('resize', resize); resize();

/* ---------- camera: a looping shot list, or free look ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const SHOTS = [
  { name: 'Wide — door light', fov: 36, p0: V(-6.6, 1.5, 5.6), p1: V(-5.4, 1.3, 6.0), t0: V(1.2, 1.0, -.6), t1: V(1.4, .9, -.6) },
  { name: 'Front three-quarter', fov: 26, p0: V(6.0, .42, 3.6), p1: V(5.0, .5, 4.6), t0: V(.5, .58, 0), t1: V(.5, .58, 0) },
  { name: 'Profile track', fov: 34, p0: V(-2.6, .34, 4.4), p1: V(2.2, .34, 4.4), t0: V(-1.2, .62, 0), t1: V(1.0, .62, 0) },
  { name: 'Wheel detail', fov: 16, p0: V(4.5, .42, 3.0), p1: V(4.0, .62, 3.4), t0: V(1.5, .42, .6), t1: V(1.42, .46, .6) },
  { name: 'Tail — neon side', fov: 30, p0: V(-6.0, .55, 2.4), p1: V(-5.4, 1.5, 3.4), t0: V(0, .65, -.3), t1: V(0, .7, -.3) },
  { name: 'Crane down', fov: 40, p0: V(4.6, 3.6, 3.4), p1: V(5.4, 1.9, 4.2), t0: V(0, .4, 0), t1: V(0, .6, 0) }
];
SHOTS.splice(2, 0,
  { name: 'Lounge — fire pit', room: 'lounge', fov: 40, p0: V(-10.3, 1.3, .3), p1: V(-11.0, 1.25, -.5), t0: V(-14.3, 1.0, -3.4), t1: V(-14.3, 1.0, -3.4) },
  { name: 'Lounge — through the door', room: 'lounge', fov: 30, p0: V(-10.4, 1.25, -6.1), p1: V(-9.7, 1.15, -5.5), t0: V(0, .6, 0), t1: V(0, .6, 0) });
SHOTS.push(
  { name: 'Bar', room: 'bar', fov: 38, p0: V(-11.0, 1.3, 2.2), p1: V(-12.2, 1.3, 2.0), t0: V(-14.6, 1.2, 5.0), t1: V(-14.3, 1.2, 5.0) },
  { name: 'Bedroom', room: 'bedroom', fov: 40, p0: V(-19.7, 1.3, -.7), p1: V(-20.3, 1.25, -1.1), t0: V(-23.2, 1.0, -4.2), t1: V(-23.2, 1.0, -4.2) },
  { name: 'Record den', room: 'den', fov: 40, p0: V(-19.7, 1.3, 6.3), p1: V(-20.5, 1.3, 6.0), t0: V(-23.4, 1.15, 2.6), t1: V(-23.2, 1.15, 2.9) });
const DUR = 8, FADE = .7;
const ROOM_ORDER = ['garage', 'lounge', 'bar', 'bedroom', 'den'];
let roomName = 'garage';
function setRoom(name) {
  if (name === roomName) return; roomName = name;
  const g = name === 'garage', R = ROOMS[name];
  street.visible = lamp.visible = tailGlow.visible = g; hemi.intensity = g ? .9 : .06; headLights.forEach(h => h.visible = g && lampsOn);
  rig.forEach((l, i) => { l.visible = !g; if (!g) { const [x, y, z, r, gg, b, k] = R.lights[i]; l.position.set(x, y, z); l.color.setRGB(r * .55 + .45, gg * .55 + .36, b * .55 + .25); l.intensity = k * .15; } });
  key.visible = !g; if (!g) { const k = R.key; key.position.set(k[0], k[1], k[2]); key.target.position.set(k[3], k[4], k[5]); key.target.updateMatrixWorld(); key.intensity = k[6]; key.angle = k[7] || 1.0; key.color.setRGB(k[8] || 1, k[9] || .82, k[10] || .63); key.shadow.camera.far = 14; key.distance = 14; }
  if (!envs[name]) envs[name] = bakeEnv([(R.target[0] + R.cam[0]) / 2, 0, (R.target[2] + R.cam[2]) / 2]);
  scene.environment = envs[name]; scene.environmentIntensity = g ? .9 : .75;
}
// each room gets its own reflection/ambient probe, baked from the room's centre the first time it is entered
function bakeEnv(c) {
  const vis = [mirror.visible, dust.visible]; mirror.visible = dust.visible = false; scene.environment = null;
  scene.position.set(-c[0], -1.5, -c[2]); scene.updateMatrixWorld(true);
  const tex = pmrem.fromScene(scene, .03, .1, 30).texture;
  scene.position.set(0, 0, 0); scene.updateMatrixWorld(true); [mirror.visible, dust.visible] = vis;
  return tex;
}
function lookRoom(name) {
  const R = ROOMS[name]; setRoom(name);
  controls.target.set(...R.target); camera.position.set(...R.cam); controls.minDistance = R.min; controls.maxDistance = R.max;
  btnRoom.textContent = 'Room: ' + R.label; slate('Free look — ' + R.label, 34);
}
let baseFov = 32;
function setFov(f) {
  baseFov = f; const a = camera.aspect, R = Math.PI / 360;
  camera.fov = a >= 1.6 ? f : Math.min(74, Math.atan(Math.tan(f * R) * 1.6 / a) / R);
  camera.updateProjectionMatrix();
}
fovReady = true;
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .6, 0); controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 3; controls.maxDistance = 6.6; controls.maxPolarAngle = Math.PI / 2 - .04; controls.enablePan = false;
controls.enabled = false;
const $ = id => document.getElementById(id);
const btnRoom = $('btnRoom'), fadeEl = $('fade'), nameEl = $('shotName'), lensEl = $('shotLens'), btnCam = $('btnCam');
let film = true, filmT = 0, shotIdx = -1, lampsOn = true, paintIdx = 0;
const tgt = new THREE.Vector3();
function slate(name, fov) { nameEl.textContent = name; lensEl.textContent = Math.round(12 / Math.tan(fov * Math.PI / 360)) + 'mm'; }
function setFilm(on) {
  film = on; controls.enabled = !on; btnCam.textContent = on ? 'Free look' : 'Resume film'; btnCam.setAttribute('aria-pressed', String(!on));
  if (!on) { setFov(34); fadeEl.style.opacity = 0; shotIdx = -1; lookRoom(roomName); }
}
function filmFrame(t) {
  const i = Math.floor(t / DUR) % SHOTS.length, u = (t % DUR) / DUR, s = SHOTS[i], e = u * u * (3 - 2 * u) * .6 + u * .4;
  if (i !== shotIdx) { shotIdx = i; setFov(s.fov); slate(s.name, s.fov); setRoom(s.room || 'garage'); btnRoom.textContent = 'Room: ' + ROOMS[roomName].label; }
  camera.position.lerpVectors(s.p0, s.p1, e); camera.lookAt(tgt.lerpVectors(s.t0, s.t1, e));

}
renderer.domElement.addEventListener('pointerdown', () => { if (film) setFilm(false); });
btnCam.addEventListener('click', () => setFilm(!film));
btnRoom.addEventListener('click', () => { const n = ROOM_ORDER[(ROOM_ORDER.indexOf(roomName) + 1) % ROOM_ORDER.length]; if (film) { roomName === n || setRoom(n); setFilm(false); } else lookRoom(n); });
$('btnLamps').addEventListener('click', e => {
  lampsOn = !lampsOn; e.currentTarget.setAttribute('aria-pressed', String(lampsOn));
  heads.forEach(h => h.visible = lampsOn); headLights.forEach(h => h.visible = lampsOn && roomName === 'garage');
  headMat.color.setRGB(1.7, 2.0, 2.6).multiplyScalar(lampsOn ? 1 : .05); tailMat.color.setRGB(2.2, .04, .06).multiplyScalar(lampsOn ? 1 : .12);
  tailGlow.intensity = lampsOn ? 6 : .6;
});
$('btnPaint').addEventListener('click', e => {
  const p = PAINTS[paintIdx = (paintIdx + 1) % PAINTS.length];
  paint.color.setHex(p.color); paint.iridescence = p.irid; paint.metalness = p.metal; paint.roughness = p.rough;
  e.currentTarget.textContent = 'Paint: ' + p.name;
});
if (reduced) setFilm(false);

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let flickHold = 0, time = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05); time += dt;
  if (film) { filmT += dt; filmFrame(filmT); } else controls.update();
  if (mixer && !reduced) { mixer.update(dt); actorStep(dt); }
  setNeon(time);
  for (const L of lavas) L.m.material.color.setHSL((L.hue + time * .013) % 1, 1, .5).multiplyScalar(1.7);
  platter.rotation.y -= dt * 3.5;
  neonLight.intensity = 30 + Math.sin(time * 13) * .8;
  if (!reduced) {
    if (flickHold > 0) flickHold -= dt; else if (Math.random() < .012) flickHold = .04 + Math.random() * .22;
    const k = flickHold > 0 ? (Math.random() < .5 ? .08 : .5) : 1;
    flick.l.intensity = flick.power * k; flick.mat.color.copy(TUBE).multiplyScalar(3 * k);
    const p = dustGeo.attributes.position;
    for (let i = 0; i < DUST; i++) {
      let y = p.getY(i) + dt * (.012 + (i % 7) * .004); if (y > 4.2) y = 0;
      p.setY(i, y); p.setX(i, p.getX(i) + Math.sin(time * .2 + i) * dt * .02);
    }
    p.needsUpdate = true;
  }
  shaftMat.uniforms.uTime.value = time; grade.uniforms.uTime.value = time;
  composer.render();
}
renderer.setAnimationLoop(frame);
window.__garage = { actor: sec => { for (let i = 0; i < sec * 20; i++) { mixer.update(.05); actorStep(.05); } }, room: n => { renderer.setAnimationLoop(null); if (film) setFilm(false); lookRoom(n); for (const L of lavas) L.m.material.color.setHSL(L.hue, 1, .5).multiplyScalar(2.2); controls.update(); controls.update(); composer.render(); }, view: (x, y, z) => { renderer.setAnimationLoop(null); setFilm(false); camera.position.set(x, y, z); controls.update(); controls.update(); composer.render(); }, seek: t => { filmT = t; }, still: t => { renderer.setAnimationLoop(null); filmT = t; time = t; filmFrame(t); fadeEl.style.opacity = 0; setNeon(t); composer.render(); } };
</script>
